name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#f4a93c&color_dots=#e8d5a9,#b9d48a,#8cc063,#5a9e4b,#3b6b3a
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ffcc4d&color_dots=#3a2d22,#4b6b32,#5a9e4b,#7cc576,#a8d977
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
